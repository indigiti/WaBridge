name: DigiOps release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP source
        run: find . -name '*.php' -not -path './release/*' -print0 | xargs -0 -n1 php -l
      - name: Validate SQLite legacy and message queue
        run: |
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"
          php tests/smoke.php
          php tests/queue.php
          php tests/loader.php
          php tests/gateway-settings.php
          php tests/auth-session.php
      - name: JSON backend tests without a database connection
        run: php tests/json-store.php
      - name: Test private database-to-JSON cutover
        run: php tests/storage-migration.php
      - name: Fetch pinned Waxum v0.16.1 private AMD64 binary archive
        run: |
          mkdir -p waxum-build
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            "https://github.com/imtaqin/waxum/releases/download/v0.16.1/waxum-0.16.1-linux-amd64.tar.gz" \
            -o waxum-build/waxum-v0.16.1-linux-amd64.tar.gz
          echo "2a8d5d9f89f600a413854b8823db3f9892e26c81ff876398716b56d21e863a61  waxum-build/waxum-v0.16.1-linux-amd64.tar.gz" | sha256sum --check
      - name: Test browser provisioning and private staging
        run: php tests/waxum-provisioning.php
      - name: Assemble DigiOps public/private payload
        run: |
          php tools/package-release.php
          php tools/check-release-package.php
          test -f release/public/.htaccess
          find release -type f -name 'config.php' | grep -q . && exit 1 || true
      - name: Upload release for DigiOps
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
