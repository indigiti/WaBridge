name: DigiOps release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-hosted premium typography and unified CSS
        run: |
          bash tools/fetch-fonts.sh
          php tools/build-assets.php
          test -s public/assets/wabridge-ui-v6.css
          test -s public/assets/fonts/inter-latin-400.woff2
      - name: Validate PHP source
        run: find . -name '*.php' -not -path './release/*' -print0 | xargs -0 -n1 php -l
      - name: Validate SQLite legacy and message queue
        run: |
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"
          php tests/smoke.php
          php tests/queue.php
          php tests/loader.php
          php tests/gateway-settings.php
          php tests/auth-session.php
          php tests/auth-navigation.php
          bash tests/auth-browser-flow.sh
      - name: JSON backend tests without a database connection
        run: php tests/json-store.php
      - name: Message activity, verified receipts and browser worker checks
        run: php tests/message-log.php
      - name: Verify fail-fast Rust diagnostics and safe send timeouts
        run: php tests/gateway-timeouts.php
      - name: Validate worker heartbeats, queue observability, and no secret leakage
        run: php tests/worker-health.php
      - name: Confirm safe connection watchdog and retry decisions
        run: php tests/reliability-ops.php
      - name: Test P1–P5 product modules without external provider calls
        run: php tests/platform-modules.php
      - name: Validate safe runtime performance telemetry
        run: php tests/runtime-metrics.php
      - name: Render all glass console routes with authenticated menu
        run: php tests/ui-shell-render.php
      - name: Verify premium dashboard files and shell
        run: |
          php tests/dashboard-shell.php
      - name: Test private database-to-JSON cutover
        run: php tests/storage-migration.php
      - name: Download verified Cloudways Waxum compatibility artifact
        uses: actions/download-artifact@v4
        with:
          name: waxum-cloudways-glibc231-amd64
          run-id: 41712571137
          repository: indigiti/WaBridge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: waxum-compat-build
      - name: Validate pinned Cloudways-compatible binary before packaging
        run: |
          test -f waxum-compat-build/waxum-v0.16.1-cloudways-glibc231-linux-amd64.tar.gz
          echo 'f6e015b58345273893a54d6b1feeacba71cfe8fdc416735bf7f2a93d186d7f8e  waxum-compat-build/waxum-v0.16.1-cloudways-glibc231-linux-amd64.tar.gz' | sha256sum --check
          grep -qx 'UPSTREAM_COMMIT=851bedf3189bda742433ef57bc06e75be590860b' waxum-compat-build/provenance.txt
          grep -qx 'MAX_GLIBC=2.31' waxum-compat-build/provenance.txt
          mkdir -p waxum-compat-check
          tar -xzf waxum-compat-build/waxum-v0.16.1-cloudways-glibc231-linux-amd64.tar.gz -C waxum-compat-check waxum
          file waxum-compat-check/waxum | grep -q 'ELF 64-bit.*x86-64'
          readelf -W --version-info waxum-compat-check/waxum | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu > waxum-compat-check/versions
          test "$(printf '%s\n' 'GLIBC_2.31' "$(tail -1 waxum-compat-check/versions)" | sort -V | tail -1)" = 'GLIBC_2.31'
          mkdir -p waxum/releases
          cp waxum-compat-build/waxum-v0.16.1-cloudways-glibc231-linux-amd64.tar.gz waxum/releases/
      - name: Test browser provisioning and private staging
        run: php tests/waxum-provisioning.php
      - name: Verify private Rust supervisor startup command
        run: bash tests/waxum-supervisor.sh
      - name: Assemble DigiOps public/private payload
        run: |
          php tools/package-release.php
          php tools/check-release-package.php
          test -f release/public/.htaccess
          find release -type f -name 'config.php' | grep -q . && exit 1 || true
      - name: Upload release for DigiOps
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: release/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error
