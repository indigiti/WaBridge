name: PHP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-hosted premium typography and unified CSS
        run: |
          bash tools/fetch-fonts.sh
          php tools/build-assets.php
          test -s public/assets/wabridge-ui-v6.css
          test -s public/assets/fonts/inter-latin-400.woff2
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Isolated browser session regression
        run: php tests/auth-session.php
      - name: Same-app redirect validation
        run: php tests/auth-navigation.php
      - name: End-to-end browser sign-in and deep-link recovery
        run: bash tests/auth-browser-flow.sh
      - name: Smoke tests
        run: php tests/smoke.php
      - name: Verify SQLite PHP extension
        run: |
          php -r "exit(extension_loaded('pdo_sqlite') ? 0 : 1);"
      - name: Queue integration tests
        run: php tests/queue.php
      - name: SQLite enqueue benchmark (informational)
        run: php benchmarks/sqlite.php 100
      - name: JSON backend integration tests (no SQLite)
        run: php tests/json-store.php
      - name: Message activity, verified receipts and browser worker checks
        run: php tests/message-log.php
      - name: Verify fail-fast Rust diagnostics and safe send timeouts
        run: php tests/gateway-timeouts.php
      - name: Validate worker heartbeats, queue observability, and no secret leakage
        run: php tests/worker-health.php
      - name: Confirm safe connection watchdog and retry decisions
        run: php tests/reliability-ops.php
      - name: Test P1–P5 product modules without external provider calls
        run: php tests/platform-modules.php
      - name: W0-W2 offline JSON foundation, isolation and event contracts
        run: php tests/vnext-foundation.php
      - name: W1 recovery, signed fixture webhooks and W2 account isolation
        run: php tests/vnext-integration.php
      - name: W1 signed synthetic webhook over real local HTTP
        run: bash tests/vnext-http-flow.sh
      - name: Validate safe runtime performance telemetry
        run: php tests/runtime-metrics.php
      - name: Render all glass console routes with authenticated menu
        run: php tests/ui-shell-render.php
      - name: Verify premium dashboard files and shell
        run: |
          php tests/dashboard-shell.php
      - name: Web-only storage migration safeguards
        run: php tests/storage-migration.php
      - name: Check Rust Supervisor command with mock binary
        run: bash tests/waxum-supervisor.sh
      - name: Check no secrets were committed
        run: |
          test ! -e config.php
          test ! -e .env
          test ! -d whatsapp_sessions
