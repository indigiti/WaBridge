openapi: 3.0.3
info:
  title: WaBridge Messaging API
  version: 0.2.0-preview
  description: Queue acceptance is distinct from WhatsApp delivery. External API requires a scoped application token.
paths:
  /api/v1/messages.php:
    post:
      summary: Queue a text notification for a consented recipient
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
          description: Unique per application operation; replays return the original job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, to, text]
              properties:
                session_id:
                  type: string
                to:
                  type: string
                  pattern: '^[1-9][0-9]{7,14}$'
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '202':
          description: Enqueued, not delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id:
                    type: string
                  status:
                    type: string
                  duplicate:
                    type: boolean
        '401':
          description: Invalid token
        '422':
          description: Invalid request or session scope
        '429':
          description: Per-client rate limit reached
        '503':
          description: Storage unavailable
  /api/v1/jobs.php:
    get:
      summary: Read queued message status
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status owned by the requesting API client
        '401':
          description: Invalid token
        '404':
          description: Job not found for client
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
